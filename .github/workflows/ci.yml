name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate syntax (bash -n)
        run: |
          bash -n bin/agent-harness tests/smoke.sh .githooks/*

      - name: Run ShellCheck
        run: |
          shellcheck -x bin/agent-harness tests/smoke.sh .githooks/*

  test:
    name: Smoke Tests & Catalog Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (jq, shellcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck

      - name: Run smoke tests
        run: |
          chmod +x bin/agent-harness tests/smoke.sh
          ./tests/smoke.sh
